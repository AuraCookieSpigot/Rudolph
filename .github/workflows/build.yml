
name: Build Rudolph

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Rudolph
        run: mvn -B clean package

      - name: Upload Rudolph JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rudolph-Plugin
          path: target/Rudolph-1.0.0.jar
